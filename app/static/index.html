<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Transcription Service</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      width: min(860px, 100%);
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(17, 24, 39, 0.08);
      padding: 32px;
    }
    h1 { margin: 0 0 8px; font-size: 32px; }
    .subtitle { color: #6b7280; margin-bottom: 28px; }
    .dropzone {
      border: 2px dashed #c7cad1;
      border-radius: 18px;
      padding: 36px 20px;
      text-align: center;
      background: #fafafa;
      transition: .2s ease;
      cursor: pointer;
    }
    .dropzone.dragover {
      border-color: #111827;
      background: #f3f4f6;
    }
    .dropzone input { display: none; }
    .file-name { margin-top: 10px; font-weight: 600; }
    .hint { color: #6b7280; font-size: 14px; margin-top: 6px; }
    button {
      margin-top: 18px;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      color: white;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { margin-top: 18px; font-size: 14px; color: #4b5563; }
    .error { color: #b91c1c; }
    .result { margin-top: 28px; display: none; }
    .meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .pill {
      background: #f3f4f6;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 13px;
    }
    .transcript {
      background: #f9fafb;
      border-radius: 14px;
      padding: 18px;
      line-height: 1.65;
      margin-bottom: 18px;
    }
    .segments { display: grid; gap: 10px; }
    .segment {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }
    .time { font-variant-numeric: tabular-nums; color: #6b7280; font-size: 14px; }
    @media (max-width: 640px) {
      .card { padding: 22px; }
      .segment { grid-template-columns: 1fr; gap: 4px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Audio Transcription Service</h1>
    <div class="subtitle">Upload an audio file and get a timestamped transcript.</div>

    <label class="dropzone" id="dropzone">
      <input id="fileInput" type="file" accept=".wav,.mp3,.m4a,.aac,.flac,.ogg,.webm,audio/*" />
      <div><strong>Drop an audio file here</strong> or click to browse</div>
      <div class="hint">Supported: WAV, MP3, M4A, AAC, FLAC, OGG, WebM</div>
      <div class="file-name" id="fileName"></div>
    </label>

    <button id="transcribeBtn" disabled>Transcribe Audio</button>
    <div class="status" id="status"></div>

    <section class="result" id="result">
      <div class="meta">
        <span class="pill" id="language"></span>
        <span class="pill" id="duration"></span>
        <span class="pill" id="segmentCount"></span>
      </div>

      <h3>Transcript</h3>
      <div class="transcript" id="transcript"></div>

      <h3>Timestamped Segments</h3>
      <div class="segments" id="segments"></div>
    </section>
  </main>

  <script>
    const input = document.getElementById("fileInput");
    const dropzone = document.getElementById("dropzone");
    const button = document.getElementById("transcribeBtn");
    const status = document.getElementById("status");
    const fileName = document.getElementById("fileName");
    const result = document.getElementById("result");

    function setFile(file) {
      if (!file) return;
      const dt = new DataTransfer();
      dt.items.add(file);
      input.files = dt.files;
      fileName.textContent = file.name;
      button.disabled = false;
      status.textContent = "";
      result.style.display = "none";
    }

    input.addEventListener("change", () => setFile(input.files[0]));

    ["dragenter", "dragover"].forEach(eventName => {
      dropzone.addEventListener(eventName, event => {
        event.preventDefault();
        dropzone.classList.add("dragover");
      });
    });

    ["dragleave", "drop"].forEach(eventName => {
      dropzone.addEventListener(eventName, event => {
        event.preventDefault();
        dropzone.classList.remove("dragover");
      });
    });

    dropzone.addEventListener("drop", event => setFile(event.dataTransfer.files[0]));

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = (seconds % 60).toFixed(2).padStart(5, "0");
      return `${mins}:${secs}`;
    }

    button.addEventListener("click", async () => {
      const file = input.files[0];
      if (!file) return;

      button.disabled = true;
      button.textContent = "Transcribing...";
      status.className = "status";
      status.textContent = "Processing audio. The first run may take longer while the model loads.";
      result.style.display = "none";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("/transcribe", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Transcription failed.");
        }

        document.getElementById("language").textContent = `Language: ${data.language || "unknown"}`;
        document.getElementById("duration").textContent = `Duration: ${data.duration ?? "n/a"}s`;
        document.getElementById("segmentCount").textContent = `Segments: ${data.segments.length}`;
        document.getElementById("transcript").textContent = data.text || "(No speech detected)";

        const segments = document.getElementById("segments");
        segments.innerHTML = "";
        data.segments.forEach(segment => {
          const row = document.createElement("div");
          row.className = "segment";

          const time = document.createElement("div");
          time.className = "time";
          time.textContent = `${formatTime(segment.start)} – ${formatTime(segment.end)}`;

          const text = document.createElement("div");
          text.textContent = segment.text;

          row.appendChild(time);
          row.appendChild(text);
          segments.appendChild(row);
        });

        status.textContent = "Transcription complete.";
        result.style.display = "block";
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = "Transcribe Audio";
      }
    });
  </script>
</body>
</html>
